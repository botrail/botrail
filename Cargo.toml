[workspace]
resolver = "2"
members = [
    "crates/botrail-model",
    "crates/botrail-mesh",
    "crates/botrail-kin",
    "crates/botrail-collide",
    "crates/botrail-plan",
    "crates/botrail-traj",
    "crates/botrail-physics",
    "crates/botrail-physics-rapier",
    "crates/botrail-export",
    "crates/botrail-scene",
    "crates/botrail-session",
    "crates/botrail-usd",
    "crates/botrail-py",
    "crates/botrail-wasm",
    "crates/botrail-bench",
    "crates/botrail-cloth",
    "crates/botrail-rope",
]

[workspace.package]
version = "0.13.0"
edition = "2021"
license = "PolyForm-Small-Business-1.0.0 OR PolyForm-Noncommercial-1.0.0"
readme = "README.md"
repository = "https://github.com/neka-nat/botrail"
authors = ["neka-nat <nekanat.stock@gmail.com>"]

[workspace.dependencies]
botrail-model = { path = "crates/botrail-model" }
botrail-mesh = { path = "crates/botrail-mesh" }
botrail-kin = { path = "crates/botrail-kin" }
botrail-collide = { path = "crates/botrail-collide" }
botrail-plan = { path = "crates/botrail-plan" }
botrail-traj = { path = "crates/botrail-traj" }
botrail-physics = { path = "crates/botrail-physics" }
botrail-physics-rapier = { path = "crates/botrail-physics-rapier" }
botrail-export = { path = "crates/botrail-export" }
botrail-scene = { path = "crates/botrail-scene" }
botrail-session = { path = "crates/botrail-session" }
botrail-cloth = { path = "crates/botrail-cloth" }
botrail-rope = { path = "crates/botrail-rope" }
botrail-usd = { path = "crates/botrail-usd" }
parry3d-f64 = "0.29"
xurdf = "0.6"
nalgebra = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["derive"] }
thiserror = "2"
# The garment, stitch and soft-release APIs are newer than rapier-cloth 0.2.0
# on crates.io: pinned to the commit until 0.3 is published.
rapier-cloth = { git = "https://github.com/neka-nat/rapier-cloth", rev = "1c4584e69101217aecbad71ab506ec64207f8356", default-features = false, features = ["f64", "implicit"] }

[profile.release]
lto = "thin"

# The cloth solver is numeric code that runs a hundred times slower
# unoptimized; its tests and a `maturin develop` build would not be usable.
[profile.dev.package.rapier-cloth-core]
opt-level = 3

[profile.dev.package.rapier-cloth]
opt-level = 3

[profile.dev.package.faer]
opt-level = 3
