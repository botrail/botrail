[workspace]
resolver = "2"
members = [
    "crates/botrail-model",
    "crates/botrail-mesh",
    "crates/botrail-kin",
    "crates/botrail-collide",
    "crates/botrail-plan",
    "crates/botrail-traj",
    "crates/botrail-export",
    "crates/botrail-scene",
    "crates/botrail-session",
    "crates/botrail-usd",
    "crates/botrail-py",
    "crates/botrail-wasm",
    "crates/botrail-bench",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/neka-nat/botrail"
authors = ["neka-nat <nekanat.stock@gmail.com>"]

[workspace.dependencies]
botrail-model = { path = "crates/botrail-model" }
botrail-mesh = { path = "crates/botrail-mesh" }
botrail-kin = { path = "crates/botrail-kin" }
botrail-collide = { path = "crates/botrail-collide" }
botrail-plan = { path = "crates/botrail-plan" }
botrail-traj = { path = "crates/botrail-traj" }
botrail-export = { path = "crates/botrail-export" }
botrail-scene = { path = "crates/botrail-scene" }
botrail-session = { path = "crates/botrail-session" }
botrail-usd = { path = "crates/botrail-usd" }
parry3d-f64 = "0.29"
xurdf = "0.5"
nalgebra = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
