[package]
name = "botrail-collide"
description = "Collision checking for botrail on top of parry3d (solid shapes only)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
botrail-model.workspace = true
botrail-kin.workspace = true
botrail-mesh.workspace = true
nalgebra.workspace = true
parry3d-f64.workspace = true
rayon = { version = "1", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[features]
# Parallel VHACD decomposition (mesh-heavy robots / imported scenes).
# Off for wasm builds (single-threaded there anyway).
parallel = ["dep:rayon"]
