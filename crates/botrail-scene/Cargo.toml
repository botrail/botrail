[package]
name = "botrail-scene"
description = "Scene state and wire protocol types shared between botrail core and studio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
botrail-model.workspace = true
botrail-export.workspace = true
botrail-kin.workspace = true
botrail-collide.workspace = true
botrail-plan.workspace = true
botrail-traj.workspace = true
nalgebra.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ts-rs = { version = "12", optional = true }

[features]
parallel = ["botrail-collide/parallel"]
# Enables TypeScript binding generation for the wire types.
# Run scripts/gen_protocol.sh to (re)generate studio/src/generated.
ts = ["dep:ts-rs"]

[dev-dependencies]
botrail-mesh.workspace = true
