[package]
name = "botrail-usd"
description = "USD scene importer for botrail (static environment geometry via openusd)"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
botrail-model.workspace = true
botrail-kin.workspace = true
botrail-mesh.workspace = true
nalgebra.workspace = true
thiserror.workspace = true
# Pre-1.0 pure-Rust USD implementation: pin an exact rev (crates.io releases
# lag main significantly; see the spike notes in design/DESIGN.md).
# Temporarily the neka-nat fork: upstream (mxpv/openusd) does not yet have
# the usdc children-TokenVector fix pxr requires to open exported .usdc
# (branch fix/usdc-children-token-vector, rebased on upstream main).
# Repoint to mxpv/openusd once the PR lands.
openusd = { git = "https://github.com/neka-nat/openusd", rev = "dce5ef95c0d52ecee03cd698865c0294f86caddf", features = ["geom", "physics"] }
anyhow = "1"

[dev-dependencies]
