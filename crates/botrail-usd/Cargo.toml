[package]
name = "botrail-usd"
description = "USD scene importer for botrail (static environment geometry via openusd)"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
botrail-model.workspace = true
botrail-kin.workspace = true
botrail-mesh.workspace = true
nalgebra.workspace = true
thiserror.workspace = true
# Pre-1.0 pure-Rust USD implementation: pin an exact rev (crates.io releases
# lag main significantly; see the spike notes in design/DESIGN.md).
# Temporarily the neka-nat fork: upstream (mxpv/openusd) does not yet have
# the usdc children-TokenVector and small-array compression fixes pxr
# requires to read exported .usdc (fix/usdc-array-compression-boundary).
# Repoint to mxpv/openusd once the PR lands.
openusd = { git = "https://github.com/neka-nat/openusd", rev = "5f4e923f4bb06522847a12b3408a6c97462f2d63", features = ["geom", "physics"] }
anyhow = "1"

[dev-dependencies]
