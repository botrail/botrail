[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "botrail"
version = "0.2.0"
description = "Build robot cells as code, verify them deterministically, ship them as USD — ROS-free, with a web-based 3D studio"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "neka-nat", email = "nekanat.stock@gmail.com" }]
keywords = ["robotics", "motion-planning", "urdf", "xacro", "kinematics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]

[project.urls]
Repository = "https://github.com/botrail/botrail"

[dependency-groups]
dev = ["pytest>=8"]
# The API reference is generated from the pyo3 docstrings, so building the docs
# also needs the extension importable (maturin develop). The markers keep the
# whole range resolvable: mkdocstrings 1.0 requires 3.10+, while the wheel
# itself stays abi3-py39 — without them `uv run` fails to resolve on any
# Python, docs or not. Docs are built on 3.12 (pages.yml).
docs = [
    "mkdocs-material>=9.5; python_version >= '3.10'",
    "mkdocstrings[python]>=1.0; python_version >= '3.10'",
    "ruff; python_version >= '3.10'",
    # scripts/docs_screenshots.py drives the studio headlessly to regenerate
    # docs/assets/studio/*.png; undeclared, a `uv sync` silently removes it.
    "playwright>=1.49; python_version >= '3.10'",
]

[tool.maturin]
manifest-path = "crates/botrail-py/Cargo.toml"
module-name = "botrail._core"
python-source = "python"
# maturin auto-detects LICENSE into the metadata (License-File) but leaves it
# out of workspace sdists — PyPI rejects that combination, so include it
# explicitly.
include = [{ path = "LICENSE", format = "sdist" }]
